<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>CyberKids — Безопасный интернет</title>
    <style>
      /* Фиксация масштабирования - размеры в процентах */
      * {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      html {
        font-size: 16px;
      }
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      @media (min-width: 1920px) {
        html {
          font-size: 18px;
        }
      }
      @media (max-width: 1280px) {
        html {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
  // Исправляем base URL для Electron
  if (window && window.process && window.process.type === 'renderer') {
    const base = document.createElement('base');
    base.href = './';
    document.head.prepend(base);
    
    // Исправляем пути к ресурсам
    document.querySelectorAll('link[rel="stylesheet"]').forEach(el => {
      if (el.href && el.href.startsWith('file:///')) {
        el.href = el.href.replace('file:///', './');
      }
    });
  }
</script>
  </body>
</html>
